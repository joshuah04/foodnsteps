# Render blueprint: one web service built from the Dockerfile plus a PostgreSQL database
services:
  - type: web
    name: foodnsteps
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodnsteps-db
          property: connectionString

databases:
  - name: foodnsteps-db
    plan: free
